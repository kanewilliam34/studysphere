name: StudySphere CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-checks:
    name: Backend Lint, Test & Security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit pip-audit

      - name: Run Ruff Format & Lint Check
        run: |
          cd backend
          ruff check .

      - name: Run Pytest Test Suite
        run: |
          cd backend
          pytest -v

  web-checks:
    name: Web Client Build & Verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install Web Dependencies
        run: |
          cd apps/web
          npm install

      - name: Build Next.js Application
        run: |
          cd apps/web
          npm run build
